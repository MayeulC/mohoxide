version: 2
updates:
  # Workflow actions, including the SHA-pinned third-party ones.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Crate updates, grouped into one PR a week. Regenerate
  # dev/package/THIRD-PARTY-LICENSES.txt when a PR changes dependencies
  # (docs/guides/packaging.md).
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
