# Builds and tests on Linux (the Mac is the development machine; Windows and
# macOS runners bill extra on a private repo).
# CI has no game data (../fa, the game install, the vault maps), so the tests
# that need it skip (RTS_SKIP_DATA_TESTS) and the GPU tests skip without an
# adapter: this catches build breaks, unit tests and the data-free suites.
# See docs/guides/testing.md "Continuous integration".
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RTS_SKIP_DATA_TESTS: "1"
  # A fresh CI checkout gains nothing from incremental builds.
  CARGO_INCREMENTAL: "0"
  # No debug info: the test binaries with it fill the runner's ~14 GB disk
  # (the linker dies with a bus error) and take longer to link. The test
  # profile zeroes debug info here too: the `[profile.test]` stanza's
  # line-tables default is overridden by this env var to keep the runner's
  # disk safe.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Our crates unoptimised (dependencies stay at opt-level 3): with no game
  # data the tests run in seconds, and the test build is ~2x faster than at
  # opt-level 1 (25-28 s vs 41-99 s on the Mac).
  CARGO_PROFILE_DEV_OPT_LEVEL: "0"
  # `[profile.test]` sets opt-level 3 for local runs; CI wants the opt-level 0
  # build above for test binaries too.
  CARGO_PROFILE_TEST_OPT_LEVEL: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cpal links ALSA (docs/guides/packaging.md); Vulkan, X11 and Wayland load at run time.
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      # The pinned nightly from rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install

      # The compiled dependencies (target/ minus our crates) and the cargo
      # registry as one archive, keyed by Cargo.lock and the toolchain. Only
      # develop saves it; pull requests restore develop's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Build tests
        run: cargo test --workspace --no-run

      # Plain cargo test, as run locally: unit tests, every suite in tests/
      # and doctests. --no-fail-fast reports every failing suite, not just the first.
      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # Type-checks the benches without a second, release build.
      - name: Benches compile
        run: cargo check --workspace --benches

      # Lints every target, warnings denied: the workspace lints in
      # Cargo.toml and the sim's determinism bans in clippy.toml.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Disk
        if: always()
        run: df -h .
